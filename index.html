/* Layout: one pocket-magazine column (max 34rem) on grained print paper; a film strip pinned to the bottom is the tab bar.
   Light = darkroom print paper. Dark = the darkroom itself under a red safelight. */
:root {
  --paper: #ECE2D0; --paper-2: #FAF5EB; --paper-3: #E2D5BE;
  --ink: #251E19; --ink-2: #66594C; --line: #CFBFA5;
  --red: #B03F2B; --on-red: #FFF8EE; --teal: #2B6A65; --yellow: #B98424;
  --strip: #2A211B; --hole: #ECE2D0; --strip-ink: #F1E5CF; --strip-mut: #A39079; --edge: #E3A13A;
  --memo: #FBF2DC; --memo-line: #E8D8B6; --tape: rgba(222, 190, 112, .62);
  --lift: 0 1px 0 rgba(70, 45, 20, .06), 0 10px 22px -12px rgba(70, 45, 20, .45);
  --grain: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .2 0 0 0 0 .14 0 0 0 0 .08 0 0 0 1.25 -.58'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");

  --vignette: radial-gradient(120% 80% at 50% 30%, transparent 55%, rgba(110, 80, 40, .14));

  --font-display: 'Hahmlet', 'Noto Serif KR', 'Nanum Myeongjo', serif;
  --font-body: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'IBM Plex Sans KR', 'Apple SD Gothic Neo', ui-monospace, monospace;
  --font-hand: 'Nanum Pen Script', 'Gaegu', 'Apple SD Gothic Neo', cursive;

  --col: 34rem;
  --tabbar-h: 4.6rem;
}

    --grain: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .95 0 0 0 0 .82 0 0 0 0 .66 0 0 0 .9 -.44'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    --mottle: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='600'%3E%3Cfilter id='m'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.008' numOctaves='3' seed='7' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .14 0 0 0 0 .08 0 0 0 .45 -.2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23m)'/%3E%3C/svg%3E");
    --vignette: radial-gradient(120% 80% at 50% 25%, rgba(150, 40, 20, .1), transparent 60%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15100D; --paper-2: #211A15; --paper-3: #2B221B;
  --ink: #EFE4D2; --ink-2: #AE9E8B; --line: #3D3129;
  --red: #E5664A; --on-red: #1A100C; --teal: #7EBDB3; --yellow: #E2B35A;
  --strip: #0A0705; --hole: #4A3D33; --strip-ink: #EADBC2; --strip-mut: #8C7B67; --edge: #E9A947;
  --memo: #2A221A; --memo-line: #3A2E24; --tape: rgba(226, 179, 90, .3);
  --lift: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 24px -12px rgba(0, 0, 0, .8);
  --grain: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .95 0 0 0 0 .82 0 0 0 0 .66 0 0 0 .9 -.44'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  --mottle: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='600'%3E%3Cfilter id='m'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.008' numOctaves='3' seed='7' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .14 0 0 0 0 .08 0 0 0 .45 -.2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23m)'/%3E%3C/svg%3E");
  --vignette: radial-gradient(120% 80% at 50% 25%, rgba(150, 40, 20, .1), transparent 60%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background-color: var(--paper);
  background-image: var(--grain), var(--mottle), var(--vignette);
  font: 400 1rem/1.78 var(--font-body);
  word-break: keep-all; overflow-wrap: break-word;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button { font: inherit; color: inherit; }
a { color: inherit; }
svg { display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* text inside pictures */
svg .hand { font-family: var(--font-hand); }
svg .sans { font-family: var(--font-body); }
svg .mono { font-family: var(--font-mono); }
.dg .t-ink, .dg .t-mut, .dg .t-acc { paint-order: stroke; stroke: var(--paper-2); stroke-width: 5px; stroke-linejoin: round; }
.dg .t-ink { fill: var(--ink); } .dg .t-mut { fill: var(--ink-2); } .dg .t-acc { fill: var(--red); }
.dg .f-ink { fill: var(--ink); } .dg .f-paper { fill: var(--paper-2); }
.dg .s-ink { stroke: var(--ink); } .dg .s-line { stroke: var(--ink-2); } .dg .s-acc { stroke: var(--red); }

/* ---------- shell ---------- */
.wrap {
  max-width: var(--col); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 2rem);
}
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: var(--col); margin: 0 auto; min-height: 3.25rem; display: flex; align-items: center; gap: .75rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: .4rem;
}
.bar-title { flex: 1; min-width: 0; font: 600 .95rem/1.3 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-code { font: 500 .75rem/1 var(--font-mono); color: var(--ink-2); letter-spacing: .08em; }
.bar[hidden], [hidden] { display: none !important; }
.back {
  appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: .2rem; min-height: 2.2rem;
  border: 1.5px solid var(--ink); background: var(--paper-2); color: var(--ink); border-radius: 999px;
  padding: .25rem .75rem .25rem .45rem; font: 600 .85rem/1.2 var(--font-body);
}
.back svg { width: 18px; height: 18px; }

/* film-strip tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--strip); color: var(--strip-ink);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  box-shadow: 0 -6px 18px -10px rgba(0, 0, 0, .5);
}
.tabbar::before, .tabbar-holes {
  content: ""; display: block; height: 7px; margin: 5px 0 0;
  background: repeating-linear-gradient(90deg, transparent 0 7px, var(--hole) 7px 17px, transparent 17px 24px);
  opacity: .9; border-radius: 2px;
}
.tabbar-in { max-width: var(--col); margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .45rem 0 .5rem;
  color: var(--strip-mut); font: 500 .72rem/1.1 var(--font-body);
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--strip-ink); }
.tab[aria-current="page"] .tab-dot { background: var(--edge); }
.tab-dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; margin-top: 1px; }
.tab-code { font: 500 .62rem/1 var(--font-mono); letter-spacing: .1em; color: var(--edge); opacity: .75; }

/* ---------- type ---------- */
.eyebrow { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; font: 500 .75rem/1.4 var(--font-mono); letter-spacing: .06em; color: var(--ink-2); }
.eyebrow .code { color: var(--red); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; color: var(--ink); }
.h1 { font-size: clamp(1.9rem, 7.4vw, 2.5rem); line-height: 1.18; font-weight: 700; letter-spacing: -.02em; }
.h2 { font-size: 1.35rem; line-height: 1.35; font-weight: 600; letter-spacing: -.01em; }
.h3 { font-size: 1.08rem; line-height: 1.4; font-weight: 600; }
.lede { font: 400 1.08rem/1.7 var(--font-display); color: var(--ink-2); margin: .9rem 0 0; }
.p { margin: 0; }
mark { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--yellow) 42%, transparent) 55%); color: inherit; padding: 0 .1em; }
strong { font-weight: 600; }
.hand { font-family: var(--font-hand); }

.page-head { padding: 1.6rem 0 1.4rem; border-bottom: 1px dashed var(--line); margin-bottom: 1.6rem; }
.page-head .h1 { margin-top: .5rem; }
.flow { display: flex; flex-direction: column; gap: 1.15rem; }
.flow > .h2 { margin-top: 1rem; }
.flow > .h3 { margin-top: .5rem; }

/* ---------- prints (figures) ---------- */
.print {
  margin: .4rem 0; background: var(--paper-2); padding: 10px 10px 0; border-radius: 2px;
  box-shadow: var(--lift); position: relative;
}
.print .scene, .print .dg { width: 100%; height: auto; border-radius: 1px; }
.print figcaption { font: 400 1.25rem/1.25 var(--font-hand); color: var(--ink-2); padding: .5rem .25rem .6rem; text-align: center; }
.print.taped::before, .print.taped::after {
  content: ""; position: absolute; top: -9px; width: 74px; height: 20px; background: var(--tape);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
}
.print.taped::before { left: 14px; transform: rotate(-6deg); }
.print.taped::after { right: 14px; transform: rotate(5deg); }
.print.diagram { background: var(--paper-2); padding: 14px 12px 0; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* compare: bad / good prints */
.cmp { display: flex; flex-direction: column; gap: .7rem; }
.cmp-switch { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.cmp-btn {
  appearance: none; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  border-radius: 999px; padding: .5rem .6rem; font: 600 .9rem/1.2 var(--font-body);
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
}
.cmp-btn .mk { font: 700 1.05rem/1 var(--font-display); }
.cmp-btn[aria-pressed="true"].bad { background: var(--ink); color: var(--paper-2); }
.cmp-btn[aria-pressed="true"].good { background: var(--red); border-color: var(--red); color: var(--on-red); }
.cmp-stage { display: grid; }
.cmp-face { grid-area: 1 / 1; transition: opacity .35s ease, transform .45s cubic-bezier(.2, .7, .2, 1); }
.cmp-face[data-on="false"] { opacity: 0; transform: rotate(-1.5deg) scale(.98); pointer-events: none; }
.cmp-face figcaption { display: flex; align-items: center; justify-content: center; gap: .5rem; }
.stamp {
  position: absolute; top: -12px; right: -8px; width: 3rem; height: 3rem; border-radius: 50%; z-index: 2;
  display: grid; place-items: center; font: 700 1.7rem/1 var(--font-display);
  border: 3px solid currentColor; transform: rotate(-12deg); background: #FAF5EB; box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
}
.stamp.bad { color: #3E4A5E; }
.stamp.good { color: #C23A24; }
.cmp-hint { font: 400 1.1rem/1.2 var(--font-hand); color: var(--ink-2); text-align: center; }

/* ---------- buttons ---------- */
.ticket {
  --notch: 7px;
  appearance: none; cursor: pointer; text-decoration: none; position: relative;
  display: inline-flex; align-items: center; gap: .7rem; min-height: 3rem;
  padding: .7rem 1.25rem .7rem 1.1rem; border: 0; border-radius: 5px;
  background: var(--red); color: var(--on-red); font: 600 .98rem/1.25 var(--font-body);
  -webkit-mask: radial-gradient(circle var(--notch) at 0 50%, #0000 97%, #000) 0 0 / 51% 100% no-repeat, radial-gradient(circle var(--notch) at 100% 50%, #0000 97%, #000) 100% 0 / 51% 100% no-repeat;
  mask: radial-gradient(circle var(--notch) at 0 50%, #0000 97%, #000) 0 0 / 51% 100% no-repeat, radial-gradient(circle var(--notch) at 100% 50%, #0000 97%, #000) 100% 0 / 51% 100% no-repeat;
  transition: transform .15s ease;
}
.ticket:active { transform: scale(.98); }
.ticket:focus-visible { outline: 2px solid var(--on-red); outline-offset: -6px; }
.ticket .stub { display: grid; place-items: center; padding-right: .7rem; border-right: 1.5px dashed color-mix(in srgb, currentColor 45%, transparent); }
.ticket .stub svg { width: 22px; height: 22px; }
.ticket > svg { width: 20px; height: 20px; flex: none; }
.ticket .t-main { display: flex; flex-direction: column; text-align: left; min-width: 0; }
.ticket .t-sub { font: 500 .72rem/1.3 var(--font-mono); letter-spacing: .08em; opacity: .82; }
.ticket.ghost { background: var(--paper-2); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.ticket.ghost:focus-visible { outline-color: var(--red); }
.ticket.wide { width: 100%; }
.ticket.ink { background: var(--ink); color: var(--paper-2); }

.labeltape {
  display: inline-flex; align-items: center; gap: .35rem;
  font: 500 .76rem/1 var(--font-body); letter-spacing: 0; padding: .4rem .55rem .38rem;
  background: var(--ink); color: var(--paper-2); border-radius: 2px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(0, 0, 0, .25);
}
.model { display: inline-block; font: 600 .7rem/1 var(--font-body); letter-spacing: 0; padding: .26rem .38rem .22rem; border: 1.5px solid currentColor; border-radius: 3px; vertical-align: .1em; margin-right: .25rem; }
.model.std { color: var(--teal); } .model.pro { color: var(--red); } .model.etc { color: var(--yellow); }

.xlink {
  display: inline-flex; align-items: center; gap: .3rem; cursor: pointer;
  font: 600 .88rem/1.3 var(--font-body); color: var(--red); background: none; border: 0; padding: 0;
  text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--red) 40%, transparent);
}

/* ---------- blocks ---------- */
.list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .55rem; }
.list li { position: relative; padding-left: 1.3rem; }
.list li::before { content: ""; position: absolute; left: .1rem; top: .62em; width: .55rem; height: .42rem; border: 1.5px solid var(--red); border-radius: 1px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: .8rem; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2.1rem minmax(0, 1fr); gap: .75rem; align-items: start; }
.steps li::before {
  content: counter(s, decimal-leading-zero); font: 600 .8rem/1 var(--font-mono); letter-spacing: .04em;
  display: grid; place-items: center; height: 1.75rem; margin-top: .12rem; border-radius: 3px;
  background: var(--strip); color: var(--edge);
}
.steps b { font-weight: 600; }

.memo {
  position: relative; margin: .6rem 0 .2rem; padding: 1rem 1rem .85rem 1.55rem;
  background-color: var(--memo);
  background-image: linear-gradient(90deg, transparent 1.05rem, color-mix(in srgb, var(--red) 45%, transparent) 1.05rem 1.15rem, transparent 1.15rem),
    repeating-linear-gradient(transparent 0 1.74rem, var(--memo-line) 1.74rem calc(1.74rem + 1px));
  background-position: 0 0, 0 .55rem;
  line-height: 1.75rem; box-shadow: var(--lift); border-radius: 1px;
}
.memo::before { content: ""; position: absolute; top: -10px; left: 50%; width: 84px; height: 20px; margin-left: -42px; background: var(--tape); transform: rotate(-3deg); }
.memo-k { font: 400 1.35rem/1 var(--font-hand); color: var(--red); margin-right: .35rem; }
.note {
  border: 1.5px dashed var(--line); border-radius: 6px; padding: .8rem .95rem; font-size: .95rem; line-height: 1.7;
  background: color-mix(in srgb, var(--paper-2) 55%, transparent);
}
.note-k { display: block; font: 600 .74rem/1 var(--font-body); letter-spacing: .02em; color: var(--ink-2); margin-bottom: .45rem; }

.rows { display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.row { padding: .8rem 0 .85rem; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: .3rem; }
.row-t { font: 600 1rem/1.4 var(--font-body); }
.row-kv { display: grid; grid-template-columns: 5.9rem minmax(0, 1fr); gap: .1rem .7rem; font-size: .93rem; line-height: 1.6; }
.row-kv dt { color: var(--ink-2); font: 500 .8rem/1.75 var(--font-body); }
.row-kv dd { margin: 0; }
.rows-cap { font: 500 .82rem/1.5 var(--font-body); letter-spacing: 0; color: var(--ink-2); margin-bottom: .55rem; }

.quote-person { border-left: 3px solid var(--red); padding: .1rem 0 .1rem .9rem; font-size: .95rem; color: var(--ink-2); }

/* ---------- home ---------- */
.mast { padding: 1.4rem 0 .4rem; }
.mast-top { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; font: 500 .72rem/1.3 var(--font-mono); letter-spacing: .14em; color: var(--ink-2); border-bottom: 2px solid var(--ink); padding-bottom: .45rem; }
.mast-title { font: 800 clamp(2.6rem, 13vw, 3.6rem)/1.02 var(--font-display); letter-spacing: -.045em; margin: .9rem 0 .35rem; }
.mast-title em { font-style: normal; color: var(--red); }
.mast-sub { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.mast-sub .hand { font-size: 1.45rem; color: var(--ink-2); }
.cover { margin: 1.2rem .3rem 1.4rem; transform: rotate(-1.4deg); }
.cover figcaption { text-align: right; }
.progress { margin: 1.4rem 0 1.6rem; }
.progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; margin-bottom: .45rem; }
.progress-top .h3 { font-size: 1rem; }
.progress-n { font: 500 .78rem/1 var(--font-mono); color: var(--ink-2); letter-spacing: .06em; }
.filmbar { background: var(--strip); border-radius: 3px; padding: 6px 6px; }
.filmbar::before, .filmbar::after { content: ""; display: block; height: 5px; background: repeating-linear-gradient(90deg, transparent 0 4px, var(--hole) 4px 10px, transparent 10px 14px); opacity: .75; }
.filmbar-frames { display: grid; grid-template-columns: repeat(43, 1fr); gap: 2px; margin: 4px 0; }
.filmbar-frames i { height: 18px; border-radius: 1px; background: #3B2E25; }
.filmbar { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hole) 25%, transparent); }
.filmbar-frames i.on { background: var(--edge); }
.section-k { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; margin: 2rem 0 .8rem; border-bottom: 2px solid var(--ink); padding-bottom: .35rem; }
.section-k .h2 { font-size: 1.2rem; }
.section-k small { font: 500 .72rem/1 var(--font-mono); letter-spacing: .12em; color: var(--ink-2); }
.toc { list-style: none; margin: 0; padding: 0; }
.toc button {
  width: 100%; appearance: none; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left;
  display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) auto; align-items: center; gap: .7rem; padding: .85rem 0;
}
.toc .n { font: 700 1.5rem/1 var(--font-display); color: var(--red); }
.toc .t { font: 600 1.02rem/1.35 var(--font-body); }
.toc .d { display: block; font: 400 .84rem/1.45 var(--font-body); color: var(--ink-2); margin-top: .1rem; }
.toc .c { font: 500 .72rem/1 var(--font-mono); color: var(--ink-2); }
.daily { margin-top: 1.6rem; }

/* theory list */
.part { margin-bottom: 2rem; }
.part-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .2rem .9rem; align-items: end; padding-bottom: .5rem; border-bottom: 2px solid var(--ink); }
.part-no { grid-row: span 2; font: 800 2.8rem/.85 var(--font-display); color: var(--red); letter-spacing: -.04em; }
.part-name { font: 700 1.3rem/1.2 var(--font-display); }
.part-desc { font-size: .88rem; color: var(--ink-2); line-height: 1.45; }
.chap { width: 100%; appearance: none; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; padding: .8rem 0; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) 1.6rem; gap: .6rem; align-items: center; }
.chap-code { font: 500 .78rem/1 var(--font-mono); color: var(--ink-2); letter-spacing: .04em; }
.chap-t { font: 600 1rem/1.4 var(--font-body); }
.chap-d { display: block; font-size: .85rem; line-height: 1.45; color: var(--ink-2); margin-top: .15rem; }
.readmark { width: 1.45rem; height: 1.45rem; border-radius: 50%; border: 1.5px dashed var(--ink-2); opacity: .55; display: grid; place-items: center; color: transparent; }
.readmark svg { width: 15px; height: 15px; }
.is-read .readmark { border: 1.5px solid var(--red); opacity: 1; color: var(--red); transform: rotate(-10deg); }

/* contact sheet of cases */
.sheet { background: var(--strip); border-radius: 4px; padding: .6rem .55rem .75rem; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem .55rem; }
.search { display: flex; align-items: center; gap: .5rem; margin: 0 0 1rem; padding: 0 .8rem; min-height: 3rem; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper-2); }
.search svg { width: 20px; height: 20px; color: var(--ink-2); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 1rem/1.4 var(--font-body); padding: .6rem 0; outline: none; }
.search input::placeholder { color: var(--ink-2); opacity: .8; }
.search:focus-within { box-shadow: 0 0 0 2px var(--red); border-color: var(--red); }
.quick { display: flex; flex-wrap: wrap; gap: .4rem; margin: -.2rem 0 1rem; }
.empty { padding: 1.4rem 1rem; text-align: center; color: var(--strip-mut); font-size: .92rem; grid-column: 1 / -1; }
.frame { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--strip-ink); display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.frame-edge { display: flex; justify-content: space-between; font: 500 .66rem/1 var(--font-mono); letter-spacing: .1em; color: var(--edge); }
.frame-img { border-radius: 2px; overflow: hidden; background: #000; position: relative; }
.frame-img svg { width: 100%; height: auto; aspect-ratio: 4 / 3; }
.frame-img .anno { display: none; }
.frame-t { font: 600 .9rem/1.35 var(--font-body); }
.frame-w { font-size: .76rem; line-height: 1.35; color: var(--strip-mut); }
.frame.is-read .frame-img::after { content: "현상 완료"; position: absolute; right: 6px; bottom: 6px; font: 500 .62rem/1 var(--font-mono); padding: .25rem .35rem; border-radius: 2px; background: var(--edge); color: #1A120C; letter-spacing: .06em; }

/* case page */
.when { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .9rem; }
.sec { display: flex; flex-direction: column; gap: .8rem; margin-top: 1.8rem; }
.sec-k { display: flex; align-items: baseline; gap: .65rem; border-bottom: 1.5px solid var(--ink); padding-bottom: .4rem; }
.sec-k .num { font: 600 .82rem/1 var(--font-mono); color: var(--red); letter-spacing: .06em; }
.sec-k .h2 { font-size: 1.2rem; }
.related { display: flex; flex-wrap: wrap; gap: .5rem .9rem; }

/* end of chapter */
.endcap { margin-top: 2.4rem; padding-top: 1.4rem; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 1rem; align-items: stretch; }
.readbtn {
  appearance: none; cursor: pointer; align-self: center; position: relative;
  width: 8.4rem; height: 8.4rem; border-radius: 50%; border: 2.5px dashed var(--ink-2); background: transparent; color: var(--ink-2);
  display: grid; place-items: center; text-align: center; font: 600 .95rem/1.3 var(--font-body); padding: 1rem;
  transition: transform .3s cubic-bezier(.2, .9, .3, 1.4), color .2s, border-color .2s;
}
.readbtn small { display: block; font: 500 .66rem/1.2 var(--font-mono); letter-spacing: .12em; margin-top: .3rem; }
.readbtn[aria-pressed="true"] { border: 3px double var(--red); color: var(--red); transform: rotate(-12deg); }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.pn .ticket { width: 100%; padding: .65rem .9rem; font-size: .88rem; }
.pn .ticket.next { justify-content: flex-end; text-align: right; }
.pn .ticket.next .t-main { text-align: right; }
.pn .ticket .t-main span:last-child { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* checklists */
.checks { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.checks li { border-bottom: 1px solid var(--line); }
.check { display: grid; grid-template-columns: 1.7rem minmax(0, 1fr); gap: .75rem; padding: .8rem 0; cursor: pointer; align-items: start; }
.check input { appearance: none; -webkit-appearance: none; margin: .15rem 0 0; width: 1.45rem; height: 1.45rem; border: 1.8px solid var(--ink); border-radius: 3px; display: grid; place-items: center; background: var(--paper-2); cursor: pointer; }
.check input::after { content: ""; width: .5rem; height: .85rem; border: solid var(--red); border-width: 0 3px 3px 0; transform: rotate(40deg) translate(-1px, -2px) scale(0); transition: transform .15s ease; }
.check input:checked::after { transform: rotate(40deg) translate(-1px, -2px) scale(1); }
.check input:checked { border-color: var(--red); }
.check-t { font: 600 .98rem/1.45 var(--font-body); display: block; }
.check-d { display: block; font-size: .86rem; line-height: 1.55; color: var(--ink-2); margin-top: .15rem; }
.check input:checked + span .check-t { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: var(--ink-2); }
.group-k { font: 600 .8rem/1 var(--font-body); letter-spacing: .02em; color: var(--red); margin: 1.4rem 0 .5rem; }
.count { font: 500 .78rem/1 var(--font-mono); color: var(--ink-2); }
.linkrows { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.linkrows button { width: 100%; appearance: none; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; display: grid; grid-template-columns: 2rem minmax(0, 1fr) 1rem; gap: .7rem; align-items: center; padding: .85rem 0; }
.linkrows svg { width: 22px; height: 22px; color: var(--red); }
.linkrows .chev { width: 16px; height: 16px; color: var(--ink-2); }

.cheat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
.cheat-card { background: var(--paper-2); border-radius: 3px; padding: .8rem .85rem .9rem; box-shadow: var(--lift); }
.cheat-card h3 { font: 700 1.05rem/1.2 var(--font-display); margin: 0 0 .45rem; color: var(--red); }
.cheat-card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .35rem; font-size: .84rem; line-height: 1.45; }
.cheat-card li { padding-left: .8rem; position: relative; }
.cheat-card li::before { content: ""; position: absolute; left: 0; top: .55em; width: .35rem; height: .35rem; background: var(--ink-2); border-radius: 50%; }
.cheat-wide { grid-column: 1 / -1; }
.terms { margin: 0; border-top: 2px solid var(--ink); }
.term { padding: .75rem 0; border-bottom: 1px solid var(--line); display: grid; gap: .2rem; }
.term dt { font: 600 1rem/1.4 var(--font-body); }
.term dt small { font: 500 .72rem/1 var(--font-mono); color: var(--ink-2); margin-left: .4rem; letter-spacing: .04em; }
.term dd { margin: 0; font-size: .93rem; line-height: 1.65; color: var(--ink-2); }

/* ---------- widgets ---------- */
.widget { background: var(--paper-2); box-shadow: var(--lift); border-radius: 3px; padding: .85rem .85rem 1rem; display: flex; flex-direction: column; gap: .8rem; }
.widget-k { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.widget-k .h3 { font-size: 1rem; }
.widget svg.scene, .widget svg.dg { width: 100%; height: auto; }
.range { width: 100%; accent-color: var(--red); height: 2rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  appearance: none; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  font: 600 .84rem/1 var(--font-body); letter-spacing: 0; padding: .5rem .65rem; border-radius: 3px; min-height: 2.2rem;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper-2); }
.chips.nowrap { flex-wrap: nowrap; }
.chip.lens { flex: 1 1 0; min-width: 0; padding: .5rem 0; font-family: var(--font-mono); }
.chip.lens[data-kind="opt"] { box-shadow: inset 0 -3px 0 var(--teal); }
.chip.lens[data-kind="crop"] { box-shadow: inset 0 -3px 0 var(--yellow); }

.chip.lens[data-kind="dig"][aria-pressed="true"] { color: var(--paper-2); }
.readout { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .8rem; align-items: start; border-top: 1px dashed var(--line); padding-top: .7rem; }
.readout-name { font: 700 1.2rem/1.3 var(--font-display); }
.readout-tag { font: 600 .76rem/1 var(--font-body); padding: .32rem .45rem; border-radius: 3px; background: var(--ink); color: var(--paper-2); align-self: center; white-space: nowrap; }
.readout-tag.opt { background: var(--teal); color: var(--paper-2); }
.readout-tag.crop { background: var(--yellow); color: #1F160D; }
.readout-tag.dig { background: transparent; color: var(--ink-2); border: 1.5px dashed var(--ink-2); }
.readout p { grid-column: 1 / -1; margin: 0; font-size: .93rem; line-height: 1.65; }
.readout .kv { grid-column: 1 / -1; display: grid; grid-template-columns: 4.8rem minmax(0, 1fr); gap: .25rem .6rem; font-size: .9rem; line-height: 1.55; margin: .2rem 0 0; }
.readout .kv dt { font: 500 .8rem/1.7 var(--font-body); color: var(--ink-2); }
.readout .kv dd { margin: 0; }
.lz-view { position: relative; border-radius: 2px; overflow: hidden; background: #000; }
.lz-view > svg:not(.lz-mini) { width: 100%; height: auto; aspect-ratio: 4 / 3; }
.lz-view.portrait { width: 100%; max-width: 19rem; margin: 0 auto; background: transparent; }
.lz-view.portrait > svg:not(.lz-mini) { aspect-ratio: 3 / 4; }
.lz-mini { position: absolute; right: 8px; top: 8px; width: 28%; height: auto; border: 2px solid #FBF7EF; border-radius: 2px; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
.legend { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .78rem; color: var(--ink-2); }
.legend i { display: inline-block; width: .9rem; height: .3rem; margin-right: .3rem; vertical-align: .2em; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; cursor: pointer; padding: .55rem .4rem; font: 600 .84rem/1.25 var(--font-body); color: var(--ink); }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper-2); }
.small-k { font: 500 .7rem/1 var(--font-mono); letter-spacing: .1em; color: var(--ink-2); }
.small-k.ko { font: 600 .78rem/1 var(--font-body); letter-spacing: 0; }

.view { animation: develop .45s ease both; }
@keyframes develop { from { opacity: 0; filter: sepia(.6) brightness(1.15); } to { opacity: 1; filter: none; } }
@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
  .cmp-face, .readbtn, .ticket { transition: none; }
}
@media (min-width: 720px) {
  .sheet { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

  stone: '#B9AE9C', stoneD: '#7E7262', brick: '#B9714F', roof: '#9C4F38', glass: '#A9C6CF',
  lamp: '#FFD27A', sil: '#1E1614', white: '#FBF8F2'
};

/* svg builder: each picture gets unique gradient/filter ids */
function mk() {
  const id = 'p' + (++mk.n);
  let defs = '', k = 0;
  return {
    lin(c1, c2, x2 = 0, y2 = 1, mid) {
      const g = id + 'g' + (k++);
      defs += `<linearGradient id="${g}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${c1}"/>` +
        (mid ? `<stop offset="${mid[0]}" stop-color="${mid[1]}"/>` : '') + `<stop offset="1" stop-color="${c2}"/></linearGradient>`;
      return `url(#${g})`;
    },
    stops(list, x2 = 0, y2 = 1) {
      const g = id + 'g' + (k++);
      defs += `<linearGradient id="${g}" x1="0" y1="0" x2="${x2}" y2="${y2}">` +
        list.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('') + `</linearGradient>`;
      return `url(#${g})`;
    },
    rad(c1, c2, cx = .5, cy = .5, r = .5) {
      const g = id + 'g' + (k++);
      defs += `<radialGradient id="${g}" cx="${cx}" cy="${cy}" r="${r}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient>`;
      return `url(#${g})`;
    },
    blur(sd) {
      const f = id + 'f' + (k++);
      defs += `<filter id="${f}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${sd}"/></filter>`;
      return `url(#${f})`;
    },
    clip(shape) {
      const c = id + 'c' + (k++);
      defs += `<clipPath id="${c}">${shape}</clipPath>`;
      return `url(#${c})`;
    },
    svg(w, h, body, label, cls = 'scene') {
      return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}"><defs>${defs}</defs>${body}</svg>`;
    }
  };
}
mk.n = 0;

/* ---------- primitives ---------- */
const R = (x, y, w, h, fill, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" ${extra}/>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const ell = (x, y, rx, ry, fill, extra = '') => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" ${extra}/>`;
const poly = (pts, fill, extra = '') => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${fill}" ${extra}/>`;
const path = (d, fill, extra = '') => `<path d="${d}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, col, w = 2, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;

function ridge(pts, base, fill, extra = '') {
  let d = `M${pts[0][0]},${base} L${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i];
    d += ` Q${px},${py} ${(px + x) / 2},${(py + y) / 2}`;
  }
  const l = pts[pts.length - 1];
  d += ` L${l[0]},${l[1]} L${l[0]},${base} Z`;
  return path(d, fill, extra);
}

function sun(x, y, r, col = '#FFF1C9', halo = '#FFE3A1', ho = .35) {
  return circ(x, y, r * 2.1, halo, `opacity="${ho * .5}"`) + circ(x, y, r * 1.45, halo, `opacity="${ho}"`) + circ(x, y, r, col);
}

function cloud(x, y, s, col = '#FFFFFF', op = .85) {
  return `<g opacity="${op}" fill="${col}">` + ell(x, y, 34 * s, 11 * s, col) + ell(x - 16 * s, y - 7 * s, 16 * s, 11 * s, col) +
    ell(x + 10 * s, y - 11 * s, 20 * s, 14 * s, col) + ell(x + 28 * s, y - 2 * s, 14 * s, 9 * s, col) + `</g>`;
}

function birds(x, y, s = 1, col = C.ink) {
  const b = (bx, by, k) => `<path d="M${bx - 7 * k},${by - 3 * k} Q${bx - 3 * k},${by - 5 * k} ${bx},${by} Q${bx + 3 * k},${by - 5 * k} ${bx + 7 * k},${by - 3 * k}" stroke="${col}" stroke-width="${1.6 * k}" fill="none" stroke-linecap="round"/>`;
  return b(x, y, s) + b(x + 18 * s, y + 8 * s, s * .8) + b(x - 14 * s, y + 12 * s, s * .7);
}

function tree(x, base, h, col = '#5F7A4C', trunk = '#5A4334') {
  return R(x - h * .035, base - h * .45, h * .07, h * .45, trunk) +
    circ(x, base - h * .62, h * .26, col) + circ(x - h * .17, base - h * .48, h * .2, col) + circ(x + h * .18, base - h * .5, h * .19, col);
}

function tower(x, base, h, col = '#6E6A72', pod = '#D9D2C6') {
  return poly([[x - h * .05, base], [x + h * .05, base], [x + h * .016, base - h * .72], [x - h * .016, base - h * .72]], col) +
    R(x - h * .075, base - h * .8, h * .15, h * .075, pod, `rx="${h * .03}"`) +
    R(x - h * .05, base - h * .835, h * .1, h * .04, col, `rx="${h * .015}"`) +
    line(x, base - h * .83, x, base - h, col, Math.max(1, h * .012));
}

function lighthouse(x, base, h) {
  const w0 = h * .16, w1 = h * .1;
  return poly([[x - w0 / 2, base], [x + w0 / 2, base], [x + w1 / 2, base - h * .8], [x - w1 / 2, base - h * .8]], '#F4EEE4') +
    poly([[x - w0 * .47, base - h * .3], [x + w0 * .47, base - h * .3], [x + w0 * .44, base - h * .42], [x - w0 * .44, base - h * .42]], C.red) +
    poly([[x - w0 * .4, base - h * .58], [x + w0 * .4, base - h * .58], [x + w0 * .37, base - h * .68], [x - w0 * .37, base - h * .68]], C.red) +
    R(x - w1 * .45, base - h * .92, w1 * .9, h * .12, '#FFE7A8') + path(`M${x - w1 * .7},${base - h * .92} L${x},${base - h} L${x + w1 * .7},${base - h * .92}Z`, C.ink);
}

function boat(x, y, s, hull = '#7A3F2E', sail = '#F3EBDD') {
  return path(`M${x - 18 * s},${y} L${x + 18 * s},${y} L${x + 12 * s},${y + 6 * s} L${x - 13 * s},${y + 6 * s}Z`, hull) +
    path(`M${x - 1 * s},${y - 2 * s} L${x - 1 * s},${y - 30 * s} L${x + 15 * s},${y - 2 * s}Z`, sail) +
    path(`M${x - 3 * s},${y - 2 * s} L${x - 3 * s},${y - 24 * s} L${x - 14 * s},${y - 2 * s}Z`, sail, 'opacity=".85"');
}

/* building; lean > 0 pulls the top inward (keystone) */
function bld(o) {
  const { x, y, w, h, fill = C.stone, win = '#6F7C86', cols = 3, rows = 5, lean = 0, roof = null, roofCol = C.roof, door = false, lit = 0 } = o;
  const P = (u, v) => { const xl = x + lean * v, xr = x + w - lean * v; return [xl + (xr - xl) * u, y - h * v]; };
  let s = poly([P(0, 0), P(1, 0), P(1, 1), P(0, 1)], fill);
  if (roof === 'tri') s += poly([P(-.04, 1), P(1.04, 1), [(P(0, 1)[0] + P(1, 1)[0]) / 2, y - h - (w - 2 * lean) * .38]], roofCol);
  if (roof === 'flat') s += poly([P(-.03, 1), P(1.03, 1), P(1.03, 1.03), P(-.03, 1.03)], roofCol);
  for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
    const u0 = (c + .28) / cols, u1 = (c + .72) / cols, v0 = (r + .32) / (rows + .2), v1 = (r + .78) / (rows + .2);
    if (door && r === 0 && c === Math.floor(cols / 2)) continue;
    const on = lit && ((c * 7 + r * 3) % 5 < lit * 5);
    s += poly([P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)], on ? C.lamp : win);
  }
  if (door) { const c = Math.floor(cols / 2); s += poly([P((c + .2) / cols, 0), P((c + .8) / cols, 0), P((c + .8) / cols, .16), P((c + .2) / cols, .16)], '#4E3B30'); }
  return s;
}

/* person: y = feet, h = height. legs = hip height ratio (short ~.40, long ~.52) */
function person(o) {
  const { x, y, h = 100, shirt = C.red, pants = C.navy, skin = C.skin, hair = C.hair, sil = null, pose = 'stand', legs = .47, sx = 1, op = 1, eyesClosed = false } = o;
  const k = sil ? { shirt: sil, pants: sil, skin: sil, hair: sil } : { shirt, pants, skin, hair };
  const r = h * .075, hip = y - h * legs, sh = y - h * .82, tw = h * .23, lw = h * .085;
  const hy = y - h + r;
  const st = (d, col, w) => `<path d="${d}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  let s = '';
  if (pose === 'walk' || pose === 'run') {
    const a = pose === 'run' ? .2 : .13;
    s += st(`M${x - lw * .3},${hip} L${x - h * a},${y}`, k.pants, lw) + st(`M${x + lw * .3},${hip} L${x + h * a * .9},${y - h * .02}`, k.pants, lw);
  } else if (pose === 'jump') {
    s += st(`M${x - lw * .5},${hip} L${x - h * .14},${hip + h * .2} L${x - h * .06},${y - h * .06}`, k.pants, lw) +
      st(`M${x + lw * .5},${hip} L${x + h * .15},${hip + h * .16} L${x + h * .22},${y - h * .1}`, k.pants, lw);
  } else {
    s += R(x - tw * .44, hip - 2, lw, y - hip + 2, k.pants, `rx="${lw * .4}"`) + R(x + tw * .44 - lw, hip - 2, lw, y - hip + 2, k.pants, `rx="${lw * .4}"`);
  }
  s += R(x - tw / 2, sh, tw, hip - sh + h * .05, k.shirt, `rx="${tw * .32}"`);
  const ay = sh + h * .045, ax = tw / 2 - h * .025, aw = h * .062;
  const arms = {
    stand: [[x - ax, ay, x - ax - h * .045, hip + h * .03], [x + ax, ay, x + ax + h * .045, hip + h * .03]],
    up: [[x - ax, ay, x - h * .21, sh - h * .2], [x + ax, ay, x + h * .21, sh - h * .2]],
    wave: [[x - ax, ay, x - ax - h * .045, hip + h * .03], [x + ax, ay, x + h * .2, sh - h * .2]],
    walk: [[x - ax, ay, x - h * .12, hip + h * .01], [x + ax, ay, x + h * .1, hip - h * .02]],
    run: [[x - ax, ay, x - h * .16, ay + h * .14], [x + ax, ay, x + h * .17, ay + h * .04]],
    jump: [[x - ax, ay, x - h * .22, sh - h * .18], [x + ax, ay, x + h * .22, sh - h * .18]],
    selfie: [[x - ax, ay, x - ax - h * .045, hip + h * .03], [x + ax, ay, x + h * .3, sh - h * .05]]
  }[pose] || [];
  arms.forEach(a => { s += st(`M${a[0]},${a[1]} L${a[2]},${a[3]}`, k.shirt, aw); });
  s += R(x - r * .38, hy + r * .5, r * .76, sh - hy - r * .3, k.skin);
  s += circ(x, hy, r, k.skin);
  if (!sil) {
    s += path(`M${x - r * 1.02},${hy + r * .15} A${r * 1.02},${r * 1.02} 0 0 1 ${x + r * 1.02},${hy + r * .15} Q${x + r * .3},${hy - r * .3} ${x - r * 1.02},${hy + r * .15}Z`, k.hair);
    if (h > 120) {
      const ey = hy + r * .12;
      s += eyesClosed ? st(`M${x - r * .5},${ey} l${r * .28},0 M${x + r * .22},${ey} l${r * .28},0`, '#3A2A22', r * .1)
        : circ(x - r * .36, ey, r * .1, '#2A1F1A') + circ(x + r * .36, ey, r * .1, '#2A1F1A');
    }
  }
  return `<g opacity="${op}"${sx !== 1 ? ` transform="translate(${x},0) scale(${sx},1) translate(${-x},0)"` : ''}>${s}</g>`;
}

/* annotation label on a photo (handwriting, light with dark outline) */
function lab(x, y, text, o = {}) {
  const { size = 22, col = '#FFF8EC', stroke = '#2B241F', anchor = 'middle', rot = 0 } = o;
  return `<text class="hand anno" x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="${col}" stroke="${stroke}" stroke-width="${size * .2}" stroke-linejoin="round" paint-order="stroke"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}>${text}</text>`;
}
/* red-pen arrow and ring */
function arrow(x1, y1, x2, y2, col = '#FFF8EC', w = 2.6, s = 10, bend = 0) {
  const mx = (x1 + x2) / 2 - (y2 - y1) * bend, my = (y1 + y2) / 2 + (x2 - x1) * bend;
  const a = Math.atan2(y2 - my, x2 - mx);
  const p1 = [x2 - s * Math.cos(a - .5), y2 - s * Math.sin(a - .5)], p2 = [x2 - s * Math.cos(a + .5), y2 - s * Math.sin(a + .5)];
  const d = `M${x1},${y1} Q${mx},${my} ${x2},${y2} M${p1} L${x2},${y2} L${p2}`;
  return `<g class="anno"><path d="${d}" stroke="#2B241F" stroke-width="${w + 2.4}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>` +
    `<path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function ring(x, y, rx, ry, col = '#FF6B4A', rot = -8) {
  return `<ellipse class="anno" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="${rx * 5.4} 14" transform="rotate(${rot} ${x} ${y})" stroke-linecap="round"/>`;
}
function grid3(w, h, col = 'rgba(255,250,240,.75)') {
  return `<g stroke="${col}" stroke-width="1.4" stroke-dasharray="5 5">` + line(w / 3, 0, w / 3, h, col, 1.4) + line(2 * w / 3, 0, 2 * w / 3, h, col, 1.4) +
    line(0, h / 3, w, h / 3, col, 1.4) + line(0, 2 * h / 3, w, 2 * h / 3, col, 1.4) + `</g>`;
}
/* paper tag inside a photo (fixed colours) */
function tag(x, y, text, o = {}) {
  const { size = 15, anchor = 'start', bg = 'rgba(251,247,239,.92)', col = C.ink } = o;
  const w = text.length * size * .92 + 14;
  const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
  return R(x0, y - size - 4, w, size + 11, bg, 'rx="3"') + `<text class="sans" x="${x0 + 7}" y="${y + 1}" font-size="${size}" fill="${col}">${text}</text>`;
}

/* ---------- backgrounds ---------- */
const SKY = {
  day: ['#86B4CC', '#DCEBE8'], gold: ['#D9774A', '#F7D79C'], blue: ['#1F355A', '#6D88AA'],
  night: ['#0B1020', '#1E2742'], grey: ['#B7BBBA', '#DADBD5'], washed: ['#EEF1EE', '#E2E8E4'], dawn: ['#C9B6C8', '#F4DCC8']
};
function sky(b, kind, w, h) { const [a, z] = SKY[kind]; return R(0, 0, w, h, b.lin(a, z)); }

/* ---------- scenes ---------- */
const SC = {};

SC.cover = () => {
  const b = mk();
  let s = R(0, 0, 400, 192, b.lin('#C9664A', '#F7D79C', 0, 1, [.55, '#EFA56A'])) + sun(286, 168, 19);
  s += ridge([[0, 178], [40, 170], [90, 181], [140, 189], [400, 190]], 192, '#8C5646');
  s += R(0, 190, 400, 110, b.lin('#E39A64', '#5E3A35'));
  for (let i = 0; i < 9; i++) s += R(286 - (22 - i * 2), 196 + i * 11, (22 - i * 2) * 2, 2.5, '#FFE3A8', `opacity="${.75 - i * .07}"`);
  s += path('M0,214 Q70,206 128,214 Q168,222 190,300 L0,300Z', '#3A2420');
  s += person({ x: 92, y: 214, h: 62, sil: '#22140F', pose: 'wave' });
  s += birds(330, 86, 1.1, '#5A2F25');
  return b.svg(400, 300, s, '골든아워 해안 절벽 위에서 손을 든 사람의 실루엣');
};

SC.quality = () => {
  const b = mk();
  const panel = (ox, hard) => {
    let s = R(ox, 0, 196, 260, hard ? b.lin('#6FA7C7', '#CFE4EA') : b.lin('#A9AEB0', '#D8D9D4'));
    s += R(ox, 175, 196, 85, hard ? '#C9B98F' : '#B9B29C');
    if (hard) s += sun(ox + 36, 36, 11, '#FFFBEA', '#FFF2C2', .5);
    else s += cloud(ox + 98, 46, 2.2, '#EEEDE8', .95) + cloud(ox + 40, 70, 1.2, '#E4E3DD', .9);
    const cx = ox + 104, cy = 168;
    if (hard) {
      s += ell(cx + 40, cy + 26, 52, 11, '#3E3528', 'opacity=".55"');
      s += circ(cx, cy, 32, b.stops([[0, '#F0B27A'], [.52, '#E39A5E'], [.53, '#9B5A35'], [1, '#7A4428']], 1, 1));
    } else {
      s += ell(cx + 10, cy + 28, 50, 12, '#3E3528', `opacity=".4" filter="${b.blur(7)}"`);
      s += circ(cx, cy, 32, b.rad('#F2BF8E', '#A8693F', .38, .32, .75));
    }
    s += tag(ox + 98, 244, hard ? '강한 빛 · 작은 광원' : '부드러운 빛 · 넓은 광원', { anchor: 'middle', size: 14 });
    return s;
  };
  return b.svg(400, 260, panel(0, true) + panel(204, false) + R(196, 0, 8, 260, 'var(--paper-2)'), '강한 빛은 그림자 경계가 선명하고 부드러운 빛은 그림자가 흐리게 퍼진다');
};

SC.daylight = () => {
  const b = mk();
  const mini = (kind) => {
    let s = '';
    const W = 196, H = 146, g = 104;
    if (kind === 'noon') {
      s += R(0, 0, W, H, b.lin('#7FB2D0', '#D6E8EC')) + sun(150, 22, 8, '#FFFDF2', '#FFF5D0', .4) + R(0, g, W, H - g, '#A9B77B');
      s += bld({ x: 44, y: g, w: 44, h: 30, fill: '#EDE4D3', win: '#7E8C96', cols: 2, rows: 1, roof: 'tri' }) + ell(66, g + 3, 26, 3, '#4D4A33', 'opacity=".45"');
      s += tree(130, g, 44, '#6E8A55') + ell(130, g + 2, 13, 3, '#3F4A2C', 'opacity=".5"');
    } else if (kind === 'gold') {
      s += R(0, 0, W, H, b.lin('#E3884F', '#F6D597')) + sun(170, 88, 10, '#FFEFC4', '#FFDFA0', .45) + R(0, g, W, H - g, '#B9884F');
      s += poly([[44, g], [88, g], [20, g + 14], [-30, g + 14]], '#5E3B22', 'opacity=".5"') + poly([[124, g], [136, g], [60, g + 10], [40, g + 10]], '#5E3B22', 'opacity=".5"');
      s += bld({ x: 44, y: g, w: 44, h: 30, fill: '#F2C48C', win: '#8C5A3C', cols: 2, rows: 1, roof: 'tri', roofCol: '#8E4A30' }) + tree(130, g, 44, '#8C7A3E', '#5A3A24');
    } else if (kind === 'blue') {
      s += R(0, 0, W, H, b.lin('#1F355A', '#7290B2')) + R(0, g, W, H - g, '#2A3452');
      s += bld({ x: 44, y: g, w: 44, h: 30, fill: '#3E4A68', win: C.lamp, cols: 2, rows: 1, roof: 'tri', roofCol: '#2D3550' }) + tree(130, g, 44, '#26324A', '#1E2638');
      s += line(170, g, 170, g - 34, '#1C2236', 2) + circ(170, g - 36, 9, '#FFD27A', 'opacity=".35"') + circ(170, g - 36, 3.5, '#FFE6AE');
    } else {
      s += R(0, 0, W, H, b.lin('#0A0F1E', '#1C2540')) + R(0, g, W, H - g, '#121828');
      [[20, 18], [60, 34], [98, 12], [140, 28], [176, 50], [34, 60], [120, 58]].forEach(([x, y]) => { s += circ(x, y, 1.2, '#E9E4D6'); });
      s += circ(160, 24, 9, '#EFE8D2') + circ(156, 21, 8, '#0D1324');
      s += bld({ x: 44, y: g, w: 44, h: 30, fill: '#232B42', win: C.lamp, cols: 2, rows: 1, roof: 'tri', roofCol: '#1A2034', lit: 1 }) + tree(130, g, 44, '#151C2D', '#10141F');
    }
    return s;
  };
  const cell = (x, y, kind, t) => `<svg x="${x}" y="${y}" width="196" height="146" viewBox="0 0 196 146">${mini(kind)}${tag(8, 136, t, { size: 13 })}</svg>`;
  const s = cell(0, 0, 'noon', '한낮 · 그림자 짧고 진함') + cell(204, 0, 'gold', '골든아워 · 길고 따뜻함') +
    cell(0, 154, 'blue', '블루아워 · 파랑과 불빛') + cell(204, 154, 'night', '밤 · 인공조명');
  return b.svg(400, 300, s, '한낮, 골든아워, 블루아워, 밤의 빛 비교');
};

SC.window = () => {

SC.histogram = () => {
  const b = mk();
  const N = 64, W = 340, X0 = 34, Y0 = 186, H = 140;
  const vals = [];
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    let v = .55 * Math.exp(-Math.pow((t - .32) / .13, 2)) + .35 * Math.exp(-Math.pow((t - .62) / .1, 2)) + .06;
    if (i >= N - 3) v = i === N - 1 ? 1 : .5;
    vals.push(v);
  }
  let d = `M${X0},${Y0}`;
  vals.forEach((v, i) => { d += ` L${X0 + (i + .5) * W / N},${Y0 - v * H}`; });
  d += ` L${X0 + W},${Y0} Z`;
  let s = `<g clip-path="${b.clip(R(X0, 30, W * (N - 3) / N, 160, '#000'))}">${path(d, 'var(--teal)', 'opacity=".55"')}</g>`;
  s += `<g clip-path="${b.clip(R(X0 + W * (N - 3) / N, 30, W * 3 / N + 2, 160, '#000'))}">${path(d, 'var(--red)')}</g>`;
  s += `<line x1="${X0}" y1="${Y0}" x2="${X0 + W}" y2="${Y0}" class="s-ink" stroke-width="2"/>`;
  [1, 2].forEach(k => { s += `<line x1="${X0 + W * k / 3}" y1="40" x2="${X0 + W * k / 3}" y2="${Y0}" class="s-line" stroke-width="1" stroke-dasharray="3 4"/>`; });
  s += `<text class="sans t-mut" x="${X0 + W / 6}" y="34" font-size="13" text-anchor="middle">그림자</text><text class="sans t-mut" x="${X0 + W / 2}" y="34" font-size="13" text-anchor="middle">중간</text><text class="sans t-mut" x="${X0 + W * 5 / 6}" y="34" font-size="13" text-anchor="middle">하이라이트</text>`;
  s += `<text class="sans t-ink" x="${X0}" y="${Y0 + 22}" font-size="13">← 어두움</text><text class="sans t-ink" x="${X0 + W}" y="${Y0 + 22}" font-size="13" text-anchor="end">밝음 →</text>`;
  s += `<path d="M250,62 Q330,52 ${X0 + W - 3},${Y0 - H + 8}" class="s-acc" stroke-width="2" fill="none"/><text class="sans t-acc" x="244" y="66" font-size="13" font-weight="600" text-anchor="end">끝에 벽처럼 쌓임</text><text class="sans t-acc" x="244" y="83" font-size="13" text-anchor="end">= 하이라이트 날아감</text>`;
  return b.svg(400, 216, s, '히스토그램: 오른쪽 끝에 쌓이면 하이라이트가 날아간 것', 'dg');
};

SC.kelvin = () => {

  let s = R(20, 66, 360, 28, g, 'rx="4" class="s-line" stroke-width="1"');

    const x = X(K);
    return `<line x1="${x}" y1="${up ? 58 : 94}" x2="${x}" y2="${up ? 66 : 102}" class="s-ink" stroke-width="1.5"/>` +
      `<text class="sans t-ink" x="${x}" y="${up ? 30 : 120}" font-size="13" font-weight="600" text-anchor="middle">${n}</text>` +
      `<text class="mono t-mut" x="${x}" y="${up ? 48 : 137}" font-size="12" text-anchor="middle">${K}K</text>`;

  s += mark(1900, '촛불', 1) + mark(2700, '전구', 0) + mark(3500, '해질녘', 1) + mark(5500, '한낮', 0) + mark(6500, '흐린 날', 1) + mark(8000, '그늘', 0);

};

  s += `<text class="sans t-ink" x="244" y="170" font-size="15" font-weight="600">유사색</text><text class="sans t-mut" x="244" y="190" font-size="13">이웃한 색</text><text class="sans t-mut" x="244" y="207" font-size="13">조화롭고 차분하다</text>`;

function face(x, y, r, o = {}) {
  const { skin = C.skin, view = 'level', shade = 0, hair = C.hair, smile = true } = o;
  let f = '';
  if (view === 'below') {
    f += R(x - r * .55, y + r * .6, r * 1.1, r * 1.4, skin) + ell(x, y + r * .72, r * .75, r * .4, C.skinS, 'opacity=".55"');
    f += ell(x, y, r * .86, r, skin);
    f += path(`M${x - r * .86},${y - r * .1} Q${x - r * .9},${y - r * 1.15} ${x},${y - r * 1.08} Q${x + r * .9},${y - r * 1.15} ${x + r * .86},${y - r * .1} Q${x},${y - r * .78} ${x - r * .86},${y - r * .1}Z`, hair);
    f += ell(x - r * .32, y - r * .36, r * .1, r * .055, '#2A1F1A') + ell(x + r * .32, y - r * .36, r * .1, r * .055, '#2A1F1A');
    f += ell(x - r * .12, y + r * .2, r * .07, r * .05, '#6B3B2C') + ell(x + r * .12, y + r * .2, r * .07, r * .05, '#6B3B2C');
    f += path(`M${x - r * .2},${y + r * .45} Q${x},${y + r * .52} ${x + r * .2},${y + r * .45}`, 'none', `stroke="#8A3E30" stroke-width="${r * .06}" stroke-linecap="round"`);
    f += path(`M${x - r * .55},${y + r * .78} Q${x},${y + r * 1.05} ${x + r * .55},${y + r * .78}`, 'none', `stroke="${C.skinS}" stroke-width="${r * .05}" opacity=".7"`);
  } else {
    f += R(x - r * .4, y + r * .7, r * .8, r * .7, skin) + ell(x, y, r * .82, r, skin);
    f += path(`M${x - r * .86},${y + r * .1} Q${x - r * .95},${y - r * 1.1} ${x},${y - r * 1.06} Q${x + r * .95},${y - r * 1.1} ${x + r * .86},${y + r * .1} Q${x + r * .6},${y - r * .7} ${x - r * .86},${y + r * .1}Z`, hair);
    f += ell(x - r * .3, y - r * .05, r * .09, r * .11, '#2A1F1A') + ell(x + r * .3, y - r * .05, r * .09, r * .11, '#2A1F1A');
    f += path(`M${x},${y + r * .05} L${x - r * .08},${y + r * .3} L${x + r * .06},${y + r * .32}`, 'none', `stroke="${C.skinS}" stroke-width="${r * .05}" stroke-linecap="round" stroke-linejoin="round"`);
    f += smile ? path(`M${x - r * .25},${y + r * .5} Q${x},${y + r * .7} ${x + r * .25},${y + r * .5}`, 'none', `stroke="#8A3E30" stroke-width="${r * .065}" stroke-linecap="round"`) : '';
  }
  if (shade) f += ell(x, y, view === 'below' ? r * .86 : r * .82, r, '#120C0A', `opacity="${shade}"`) + (view === 'below' ? R(x - r * .55, y + r * .6, r * 1.1, r * 1.4, '#120C0A', `opacity="${shade * .8}"`) : '');
  return f;
}

  $$('[data-lmode]', w).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lmode === st.mode)));
  $('.widget-k .h3', w).textContent = st.mode === 'A' ? '렌즈 버튼을 눌러 보세요' : '인물 크기를 고정하고 렌즈를 바꾸면';
  $('.widget-k .small-k', w).textContent = st.mode === 'A' ? 'FIELD OF VIEW' : 'DISTANCE';
  $('.lz-out', w).innerHTML = st.mode === 'A' ? lensViewA(st) : lensViewB(st);
  const f = LENSES.find(l => l[0] === st.z)[1], kind = kindOf(st.m, st.z), m = MODELS[st.m];
  let p;
  if (st.mode === 'A') {
    p = st.z === .5 ? '같은 자리에서 가장 넓게. 노란 틀이 각 배율이 담는 범위다.' : `같은 자리에서 찍었으니 원근감은 .5와 똑같다. 가운데를 ${(f / 13).toFixed(1)}배 확대한 것과 같다.`;
    if (st.z === .5 && st.m === 'std') p += ' 16e와 Air처럼 후면 카메라가 하나인 모델에는 .5가 없다.';
  } else {
    const d = 2.267 * f / 36;
    p = `인물을 같은 크기로 담으려면 약 ${d < 1 ? d.toFixed(1) : Math.round(d * 10) / 10}m 떨어져야 한다. ` +
      (f <= 13 ? '너무 가까워 얼굴과 몸 비율이 왜곡되기 쉽다.' : f <= 24 ? '배경은 작고 멀어 보인다.' : f <= 48 ? '배경이 조금씩 당겨져 보인다.' : '멀리서 찍은 만큼 배경이 크게 당겨져 보인다(압축).');
  }
  $('.readout', w).innerHTML = `<span class="readout-name">${st.z === .5 ? '.5' : st.z + 'x'} · ${f}mm</span><span class="readout-tag ${kind}">${KIND[kind][0]}</span>
    <p>${p}</p><dl class="kv"><dt>내 기종</dt><dd>${m.name} (${m.sub}): ${KIND[kind][1]}</dd></dl>`;
}

/* ---------- screens ---------- */
const view = () => $('#view');
function readBtn(id) {
  const on = READ.has(id);
  return `<button type="button" class="readbtn" data-read="${id}" aria-pressed="${on}">${on ? '현상 완료' : '다 읽었어요'}<small>${on ? 'READ ✓' : 'TAP TO MARK'}</small></button>`;
}
function pnHTML(list, id) {
  const i = list.indexOf(id), prev = list[i - 1], next = list[i + 1];
  const tk = (t, dir) => t ? `<button type="button" class="ticket ghost ${dir}" data-go="${t}"><span class="t-main"><span class="t-sub">${dir === 'prev' ? '← 이전' : '다음 →'}</span><span>${label(t)}</span></span></button>` : '<span></span>';
  return `<div class="pn">${tk(prev, 'prev')}${tk(next, 'next')}</div>`;
}
function renderChapter(id) {
  const c = CH[id], p = PART_OF[id];
  return `<header class="page-head"><div class="eyebrow"><span class="code">${c.code}</span><span>PART ${p.no} · ${p.name}</span></div>
    <h1 class="h1">${c.title}</h1><p class="lede">${c.lede}</p></header>
    <div class="flow">${c.body.map(block).join('')}</div>
    <div class="endcap">${readBtn(id)}${pnHTML(ORDER, id)}</div>`;
}
function renderCase(id) {
  const c = CASE[id];
  const order = CASES.map(x => x.id);
  return `<header class="page-head"><div class="eyebrow"><span class="code">CASE ${c.no}</span><span>상황별</span></div>
    <h1 class="h1">${c.title}</h1><p class="lede">${c.short}</p>
    <div class="when">${c.when.map(w => `<span class="labeltape">${w}</span>`).join('')}</div></header>
    ${compareHTML(CS[id].bad(), CS[id].good(), c.cap[0], c.cap[1])}
    <section class="sec"><div class="sec-k"><span class="num">01</span><h2 class="h2">문제</h2></div><p class="p">${inline(c.problem)}</p></section>
    <section class="sec"><div class="sec-k"><span class="num">02</span><h2 class="h2">원리</h2></div><p class="p">${inline(c.principle)}</p>
      <div class="related">${c.links.map(l => `<button type="button" class="xlink" data-go="${l}">${label(l)}</button>`).join('')}</div></section>
    <section class="sec"><div class="sec-k"><span class="num">03</span><h2 class="h2">해결</h2></div><ol class="steps">${c.fix.map(x => `<li><span>${inline(x)}</span></li>`).join('')}</ol></section>
    <aside class="note" style="margin-top:1.4rem"><span class="note-k">메모</span>${inline(c.note)}</aside>
    <div class="endcap">${readBtn(id)}${pnHTML(order, id)}</div>`;
}
function renderHome() {
  const last = store.get('last', null);
  const cont = last && valid(last) && !['home', 'theory', 'cases', 'check'].includes(last) ? last : 'intro';
  const readCount = [...READ].filter(x => CH[x] || CASE[x]).length;
  const frames = [...ORDER, ...CASES.map(c => c.id)].map(id => `<i class="${READ.has(id) ? 'on' : ''}"></i>`).join('');
  const tip = DAILY[Math.floor(Math.random() * DAILY.length)];
  const tocRow = (n, t, d, go, c) => `<li><button type="button" data-${go[0]}="${go[1]}"><span class="n">${n}</span><span><span class="t">${t}</span><span class="d">${d}</span></span><span class="c">${c}</span></button></li>`;
  return `<section class="mast">
      <div class="mast-top"><span>VOL.01 · 이론편</span><span>2026 가을호</span></div>
      <h1 class="mast-title">사진 잘<br>찍는 <em>법</em></h1>
      <div class="mast-sub"><span class="hand">아이폰으로 떠나는 여행 사진</span><span class="small-k">43 STORIES</span></div>
    </section>
    <figure class="print taped cover">${SC.cover()}<figcaption>해가 지기 20분 전, 측광에서 역광으로</figcaption></figure>
    <button type="button" class="ticket wide" data-go="${cont}"><span class="stub">${icon(cont === 'intro' ? 'player-play' : 'bookmark')}</span>
      <span class="t-main"><span class="t-sub">${cont === 'intro' ? 'START' : 'CONTINUE'}</span><span>${cont === 'intro' ? '처음부터 읽기' : '이어서 읽기 · ' + label(cont)}</span></span></button>
    <div class="progress"><div class="progress-top"><h2 class="h3">현상한 필름</h2><span class="progress-n">${readCount} / ${TOTAL}컷</span></div>
      <div class="filmbar" role="img" aria-label="${TOTAL}편 중 ${readCount}편 읽음"><div class="filmbar-frames">${frames}</div></div></div>
    <div class="section-k"><h2 class="h2">이번 호 차례</h2><small>CONTENTS</small></div>
    <ul class="toc">
      ${PARTS.map(p => tocRow(p.no, p.name, p.desc, ['go', p.ch[0]], p.ch.length + '편')).join('')}
      ${tocRow('6', '상황별 케이스', '여행지에서 바로 꺼내 보는 14가지 장면', ['tab', 'cases'], '14편')}
      ${tocRow('7', '체크와 부록', '아이폰 설정, 여행 루틴, 치트시트, 용어', ['tab', 'check'], '6편')}
    </ul>
    <aside class="memo daily"><span class="memo-k">오늘의 한 줄</span>${tip}</aside>
    ${STANDALONE ? '' : `<aside class="note" style="margin-top:1.6rem"><span class="note-k">홈 화면에 추가하기</span>아이폰 Safari에서 아래쪽 공유 버튼(네모에 위쪽 화살표)을 누르고 ‘홈 화면에 추가’를 고르면 앱처럼 열려요. 한 번 열어 두면 데이터가 없어도 열립니다.</aside>`}`;
}
function renderTheory() {
  return `<header class="page-head"><div class="eyebrow"><span class="code">PART 0–5</span><span>이론</span></div><h1 class="h1">이론</h1>
    <p class="lede">빛, 노출, 구도, 화각, 색. 출발 전에 한 번 읽어 두면 현장에서 손이 먼저 움직인다.</p></header>` +
    PARTS.map(p => `<section class="part"><div class="part-head"><span class="part-no">${p.no}</span><span class="part-name">${p.name}</span><span class="part-desc">${p.desc}</span></div>
      ${p.ch.map(id => `<button type="button" class="chap ${READ.has(id) ? 'is-read' : ''}" data-go="${id}"><span class="chap-code">${CH[id].code}</span><span><span class="chap-t">${CH[id].title}</span><span class="chap-d">${CH[id].short}</span></span><span class="readmark" aria-label="${READ.has(id) ? '읽음' : '안 읽음'}">${icon('check')}</span></button>`).join('')}</section>`).join('');
}
function renderCases() {
  return `<header class="page-head"><div class="eyebrow"><span class="code">CASE 01–14</span><span>상황별</span></div><h1 class="h1">상황별 케이스</h1>
    <p class="lede">여행지에서 마주치는 14가지 장면. 문제, 원리, 해결 순서로 보고 ✕/○ 컷을 비교한다.</p></header>
    <label class="search" for="case-search">${icon('search')}<span class="sr">상황 검색</span><input id="case-search" type="search" placeholder="노을, 카페, 셀카처럼 찾아보세요" autocomplete="off" enterkeyhint="search"></label>
    <div class="quick">${['노을', '야경', '음식', '인물', '실내', '비'].map(k => `<button type="button" class="chip" data-q="${k}">${k}</button>`).join('')}</div>
    <div class="sheet"><p class="empty" hidden>맞는 장면이 없어요. 다른 말로 찾아보세요.</p>${CASES.map(c => `<button type="button" class="frame ${READ.has(c.id) ? 'is-read' : ''}" data-go="${c.id}">
      <span class="frame-edge"><span>${c.no}A ▸</span><span>FILM 400</span></span>
      <span class="frame-img">${CS[c.id].good().replace('<svg ', '<svg preserveAspectRatio="xMidYMid slice" ')}</span>
      <span class="frame-t">${c.title}</span><span class="frame-w">${c.short}</span></button>`).join('')}</div>`;
}
function checkItem(it) {
  return `<li><label class="check"><input type="checkbox" data-check="${it.id}" ${CHECKED.has(it.id) ? 'checked' : ''}><span><span class="check-t">${it.t}</span><span class="check-d">${inline(it.d)}</span></span></label></li>`;
}
function renderCheck() {
  const n = SETUP.filter(x => CHECKED.has(x.id)).length;
  return `<header class="page-head"><div class="eyebrow"><span class="code">CHECK</span><span>체크와 부록</span></div><h1 class="h1">떠나기 전, 그리고 현장에서</h1>
    <p class="lede">체크 표시는 이 기기에만 저장된다. 여행이 끝나면 아래에서 한 번에 지울 수 있다.</p></header>
    <div class="section-k"><h2 class="h2">아이폰 설정</h2><small class="count" data-count>${n} / ${SETUP.length}</small></div>
    <ul class="checks">${SETUP.map(checkItem).join('')}</ul>
    <div class="section-k"><h2 class="h2">여행 촬영 루틴</h2><small>ROUTINE</small></div>
    ${ROUTINE.map(g => `<p class="group-k">${g.k}</p><ul class="checks">${g.items.map(checkItem).join('')}</ul>`).join('')}
    <div style="margin-top:1rem"><button type="button" class="ticket ghost" data-reset>${icon('rotate')}체크 모두 지우기</button><p class="small-k ko" data-reset-msg style="margin:.6rem 0 0" hidden></p></div>
    <div class="section-k"><h2 class="h2">부록</h2><small>APPENDIX</small></div>
    <ul class="linkrows">${Object.entries(XPAGES).map(([k, x]) => `<li><button type="button" data-go="${k}">${icon(x.icon)}<span><span class="chap-t">${x.title}</span><span class="chap-d">${x.d}</span></span>${icon('chevron-right', 'chev')}</button></li>`).join('')}</ul>`;
}
function renderX(id) {
  const x = XPAGES[id];
  let body = '';
  if (id === 'cheat') {
    const card = (t, items, wide) => `<div class="cheat-card ${wide ? 'cheat-wide' : ''}"><h3>${t}</h3><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
    body = `<div class="cheat">
      ${card('빛', ['해가 어디 있나 먼저 본다', '인물은 비스듬한 45° 빛', '골든아워·블루아워를 일정에', '한낮 인물은 그늘로'])}
      ${card('노출', ['탭 → 위아래로 밀기', '길게 누르면 AE/AF 잠금', '흰 건 +, 검은 건 −', '하이라이트를 지킨다'])}
      ${card('구도', ['주인공을 한 문장으로', '다가가서 빼기', '수평선은 1/3 선에', '선, 틀, 층을 찾는다', '가장자리 한 바퀴'])}
      ${card('화각', ['원근감은 거리가 정한다', '.5는 전경에 바짝', '인물은 1x~2x, 1.5m 이상', '버튼 배율만 쓰고 나중에 자르기'])}
      ${card('색', ['따뜻함으로 분위기', '채도보다 생동감', '색은 하나만 강조', '같은 날 사진은 편집 복사'])}
      ${card('사람', ['폰은 허리 높이로', '발끝은 아래 가장자리', '머리 뒤 기둥 피하기', '여러 장 연속으로'])}
      ${card('상황별 한 줄', CASES.map(c => `<button type="button" class="xlink" data-go="${c.id}">${c.title}</button> ${CHEAT_ONE[c.id]}`), true)}
    </div>`;
  } else if (id === 'mistakes') {
    body = `<ol class="steps">${MISTAKES.map(([t, d, l]) => `<li><span><b>${t}</b><br>${d}${l ? ` <button type="button" class="xlink" data-go="${l}">${label(l)}</button>` : ''}</span></li>`).join('')}</ol>`;
  } else if (id === 'people') {
    body = `<p class="p" style="margin-bottom:1rem">사진은 이 앱에 싣지 않았다. 이름으로 검색해서 직접 찾아보자.</p><div class="rows">${PEOPLE.map(([ko, en, w, d, learn, l]) =>
      `<div class="row"><span class="row-t">${ko} <span class="small-k">${en}</span></span><dl class="row-kv"><dt>시대·지역</dt><dd>${w}</dd><dt>특징</dt><dd>${d}</dd><dt>배울 점</dt><dd>${learn} · <button type="button" class="xlink" data-go="${l}">${label(l)}</button></dd></dl></div>`).join('')}</div>`;
  } else {
    body = `<dl class="terms">${TERMS.map(([t, e, d]) => `<div class="term"><dt>${t}<small>${e}</small></dt><dd>${d}</dd></div>`).join('')}</dl>`;
  }
  return `<header class="page-head"><div class="eyebrow"><span class="code">APPENDIX</span><span>체크와 부록</span></div><h1 class="h1">${x.title}</h1><p class="lede">${x.d}</p></header>${body}`;
}

/* ---------- router ---------- */
let STACK = [];
function render(id) {
  const v = view();
  CMP_N = 0;
  v.innerHTML = id === 'home' ? renderHome() : id === 'theory' ? renderTheory() : id === 'cases' ? renderCases() : id === 'check' ? renderCheck()
    : CH[id] ? renderChapter(id) : CASE[id] ? renderCase(id) : renderX(id);
  v.classList.remove('view'); void v.offsetWidth; v.classList.add('view');
  $$('[data-w="light"]', v).forEach(w => updateLight(w, 45));
  $$('[data-w="lens"]', v).forEach(updateLens);
  const root = ['home', 'theory', 'cases', 'check'].includes(id);
  const bar = $('#bar');
  bar.hidden = root;
  if (!root) {
    $('#bar-title').textContent = CH[id] ? CH[id].title : CASE[id] ? CASE[id].title : XPAGES[id].title;
    $('#bar-code').textContent = CH[id] ? CH[id].code : CASE[id] ? 'CASE ' + CASE[id].no : 'APPX';
  }
  const g = groupOf(id);
  $$('.tab').forEach(t => t.toggleAttribute('aria-current', false));
  const cur = $(`.tab[data-tab="${g}"]`); if (cur) cur.setAttribute('aria-current', 'page');
  document.title = root ? '사진 잘 찍는 법' : `${label(id)} · 사진 잘 찍는 법`;
  if (CH[id] || CASE[id]) store.set('last', id);
}
function go(id, push = true) {
  if (!valid(id)) return;
  if (push && STACK.length) STACK[STACK.length - 1].y = window.scrollY;
  if (push) STACK.push({ id, y: 0 });
  render(id);
  window.scrollTo(0, 0);
}
function back() {
  if (STACK.length > 1) {
    STACK.pop();
    const top = STACK[STACK.length - 1];
    render(top.id);
    window.scrollTo(0, top.y || 0);
  } else { const g = groupOf(STACK[0] ? STACK[0].id : 'home'); STACK = [{ id: g, y: 0 }]; render(g); window.scrollTo(0, 0); }
}
function tab(id) { STACK = [{ id, y: 0 }]; render(id); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-go]');
  if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.tab) { tab(t.dataset.tab); return; }
  if (t.hasAttribute('data-back')) { back(); return; }
  if (t.dataset.cmpset) {
    const c = t.closest('.cmp'), which = t.dataset.cmpset;
    $$('.cmp-btn', c).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cmpset === which)));
    $$('.cmp-face', c).forEach(f => { const on = f.dataset.face === which; f.dataset.on = String(on); f.setAttribute('aria-hidden', String(!on)); });
    const h = $('.cmp-hint', c); if (h) h.hidden = true;
    return;
  }
  if (t.dataset.q) { const i = $('#case-search'); i.value = i.value === t.dataset.q ? '' : t.dataset.q; filterCases(i.value); $$('[data-q]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === i.value))); return; }
  if (t.dataset.sun) { const w = t.closest('.widget'); $('.range', w).value = t.dataset.sun; updateLight(w, +t.dataset.sun); return; }
  if (t.dataset.model) { const w = t.closest('.widget'); w.dataset.m = t.dataset.model; updateLens(w); return; }
  if (t.dataset.lens) { const w = t.closest('.widget'); w.dataset.z = t.dataset.lens; updateLens(w); return; }
  if (t.dataset.lmode) { const w = t.closest('.widget'); w.dataset.mode = t.dataset.lmode; updateLens(w); return; }
  if (t.dataset.read) {
    const id = t.dataset.read;
    READ.has(id) ? READ.delete(id) : READ.add(id);
    store.set('read', [...READ]);
    t.outerHTML = readBtn(id);
    return;
  }
  if (t.hasAttribute('data-reset')) {
    CHECKED = new Set(); store.set('check', []);
    $$('[data-check]').forEach(i => { i.checked = false; });
    const c = $('[data-count]'); if (c) c.textContent = `0 / ${SETUP.length}`;
    const m = $('[data-reset-msg]'); if (m) { m.hidden = false; m.textContent = '체크를 모두 지웠어요'; }
  }
});
document.addEventListener('input', e => {
  if (e.target.matches('#sun-angle')) updateLight(e.target.closest('.widget'), +e.target.value);
  if (e.target.matches('#case-search')) { filterCases(e.target.value); $$('[data-q]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === e.target.value))); }
});
document.addEventListener('change', e => {
  const i = e.target.closest('[data-check]');
  if (!i) return;
  i.checked ? CHECKED.add(i.dataset.check) : CHECKED.delete(i.dataset.check);
  store.set('check', [...CHECKED]);
  const c = $('[data-count]'); if (c) c.textContent = `${SETUP.filter(x => CHECKED.has(x.id)).length} / ${SETUP.length}`;
});

(function start() {
  const h = (location.hash || '').slice(1);
  const first = valid(h) ? h : 'home';
  const g = groupOf(first);
  STACK = first === g ? [{ id: g, y: 0 }] : [{ id: g, y: 0 }, { id: first, y: 0 }];
  render(first);
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => { /* offline copy unavailable; the app still works online */ }); });
}

</script>
